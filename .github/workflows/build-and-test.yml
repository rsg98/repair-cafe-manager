name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Build & Test (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install frontend dependencies
        id: install-frontend
        run: npm install 2>&1 | tee /tmp/install-frontend.log

      - name: Run unit tests
        id: unit-tests
        run: npm test 2>&1 | tee /tmp/unit-tests.log

      - name: Build frontend application
        id: build-frontend
        if: (success() || failure()) && steps.install-frontend.outcome == 'success'
        run: npm run build 2>&1 | tee /tmp/build-frontend.log

      - name: Install Cloud Functions dependencies
        id: install-functions
        if: success() || failure()
        working-directory: ./functions
        run: npm install 2>&1 | tee /tmp/install-functions.log

      - name: Build Cloud Functions
        id: build-functions
        if: (success() || failure()) && steps.install-functions.outcome == 'success'
        working-directory: ./functions
        run: npm run build 2>&1 | tee /tmp/build-functions.log

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v8
        env:
          STEP_INSTALL_FRONTEND: ${{ steps.install-frontend.outcome }}
          STEP_UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          STEP_BUILD_FRONTEND: ${{ steps.build-frontend.outcome }}
          STEP_INSTALL_FUNCTIONS: ${{ steps.install-functions.outcome }}
          STEP_BUILD_FUNCTIONS: ${{ steps.build-functions.outcome }}
        with:
          script: |
            const fs = require('fs');

            const steps = [
              { name: 'Install frontend dependencies', outcome: process.env.STEP_INSTALL_FRONTEND, log: '/tmp/install-frontend.log' },
              { name: 'Run unit tests', outcome: process.env.STEP_UNIT_TESTS, log: '/tmp/unit-tests.log' },
              { name: 'Build frontend application', outcome: process.env.STEP_BUILD_FRONTEND, log: '/tmp/build-frontend.log' },
              { name: 'Install Cloud Functions dependencies', outcome: process.env.STEP_INSTALL_FUNCTIONS, log: '/tmp/install-functions.log' },
              { name: 'Build Cloud Functions', outcome: process.env.STEP_BUILD_FUNCTIONS, log: '/tmp/build-functions.log' },
            ];

            const failedSteps = steps.filter((s) => s.outcome === 'failure');
            const shortSha = context.sha.slice(0, 7);
            const refName = process.env.GITHUB_REF_NAME || context.ref;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const statusTable = [
              '| Step | Outcome |',
              '| :--- | :--- |',
              ...steps.map((s) => `| ${s.name} | \`${s.outcome || 'skipped'}\` |`),
            ].join('\n');

            const failureLogs = failedSteps
              .map((s) => {
                let logExcerpt = 'No log output captured.';
                if (fs.existsSync(s.log)) {
                  const raw = fs.readFileSync(s.log, 'utf8').trim();
                  logExcerpt = raw.length > 4000 ? `... (truncated)\n${raw.slice(-4000)}` : raw;
                }
                return `### ${s.name}\n\`\`\`text\n${logExcerpt}\n\`\`\``;
              })
              .join('\n\n');

            const body = [
              '## Automated Build & Test Failure Report',
              '',
              `- **Workflow Run:** [View Run #${context.runId}](${runUrl})`,
              `- **Branch / Ref:** \`${refName}\``,
              `- **Commit:** \`${context.sha}\``,
              `- **Triggered By:** @${context.actor}`,
              '',
              '## Step Summary',
              statusTable,
              '',
              '## Failure Output',
              failureLogs || '_No specific step failure logs available._',
            ].join('\n');

            const failedNames = failedSteps.map((s) => s.name).join(', ') || 'Workflow error';
            const title = `CI Failure (${shortSha}): ${failedNames}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title.slice(0, 250),
              body,
            });
