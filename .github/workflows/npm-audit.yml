name: Dependency Security Audit

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  npm-audit:
    name: npm audit (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Frontend
            workdir: .
            issue_title: 'npm audit found vulnerabilities (frontend)'
          - name: Cloud Functions
            workdir: functions
            issue_title: 'npm audit found vulnerabilities (functions)'
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.target.workdir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit action
        uses: oke-py/npm-audit-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.target.workdir }}
          audit_level: moderate
          issue_title: ${{ matrix.target.issue_title }}
          dedupe_issues: true
          dedupe_comments: true
          resolve_pr_comments: true
          report_format: markdown
